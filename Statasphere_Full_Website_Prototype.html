<style>
:root {
  --navy:#2f315f;
  --pink:#cf8fb4;
  --bg:#fbfafb;
  --line:#e8e4eb;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg)}
body{
  margin:0;
  background:var(--bg);
  color:var(--navy);
  font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.master-nav{
  height:72px;
  display:flex;
  align-items:center;
  gap:28px;
  padding:0 5.5vw;
  position:sticky;
  top:0;
  z-index:9999;
  background:rgba(251,250,251,.95);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(12px);
}
.brand{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:250px;
  font-size:21px;
  font-weight:760;
  letter-spacing:-.03em;
  color:var(--navy);
  text-decoration:none;
}
.brand img{
  width:35px;
  height:35px;
  object-fit:contain;
}
.nav-links{
  flex:1;
  display:flex;
  justify-content:center;
  gap:29px;
}
.nav-links button,
.login{
  border:0;
  background:none;
  font:inherit;
  font-size:14px;
  color:#747d96;
  cursor:pointer;
  text-decoration:none;
}
.nav-links button:hover,.login:hover{color:var(--navy)}
.nav-actions{
  min-width:250px;
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:18px;
}
.explore{
  border:0;
  background:var(--navy);
  color:#fff;
  padding:13px 18px;
  border-radius:4px;
  font:inherit;
  font-size:14px;
  font-weight:730;
  cursor:pointer;
}
.site-section{
  width:100%;
  margin:0;
  padding:0;
  background:var(--bg);
}
.site-section iframe{
  display:block;
  width:100%;
  min-height:700px;
  border:0;
  margin:0;
  padding:0;
  overflow:hidden;
  background:var(--bg);
}
#hero{scroll-margin-top:72px}
#problem,#how-it-works,#signal-brief,#actions,#closing{scroll-margin-top:72px}
.share-note{
  display:none;
}
@media(max-width:900px){
  .master-nav{padding:0 18px}
  .nav-links{display:none}
  .brand{min-width:0;flex:1}
  .nav-actions{min-width:0}
}
@media(max-width:620px){
  .login{display:none}
  .explore{padding:11px 13px;font-size:13px}
}
</style>
</head>

    position:absolute;
    left:50%; top:50%;
    transform:translate(-50%,-50%);
    width:640px; height:640px;
  }
  .ring {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    border-radius:50%;
    pointer-events:none;
  }
  .ring.outer {
    width:610px;height:610px;border:3px dashed rgba(41,43,89,.11);
  }
  .ring.mid {
    width:430px;height:430px;border:2px solid rgba(220,174,202,.55);
    box-shadow:0 0 90px rgba(220,174,202,.15) inset;
  }
  .ring.inner {
    width:270px;height:270px;border:2px solid rgba(41,43,89,.10);
  }

  .center-logo-wrap {
    position:absolute;
    left:50%; top:50%;
    transform:translate(-50%,-50%);
    width:150px; height:150px;
    display:flex; align-items:center; justify-content:center;
    z-index:10;
    background:transparent;
    border:none;
    box-shadow:none;
  }
  .center-logo {
    width:138px;
    height:138px;
    object-fit:contain;
    animation:spinLogo 14s linear infinite;
    filter:drop-shadow(0 10px 16px rgba(41,43,89,.10));
    background:transparent;
  }
  @keyframes spinLogo {
    from { transform:rotate(0deg); }
    to { transform:rotate(360deg); }
  }

  .ray {
    position:absolute;
    left:50%; top:50%;
    width:300px; height:1.5px;

  }


  .flow-dot {
    position:absolute;
    left:50%;
    top:50%;
    width:9px;
    height:9px;
    border-radius:50%;
    background:var(--pink);
    box-shadow:0 0 0 5px rgba(220,174,202,.08);
    z-index:3;
    transform:translate(-50%,-50%);
    opacity:.9;
  }
  .flow-dot.d1 { animation:flow1 4.8s ease-in-out infinite; }
  .flow-dot.d2 { animation:flow2 5.6s ease-in-out infinite .8s; }
  .flow-dot.d3 { animation:flow3 5.2s ease-in-out infinite 1.4s; }
  .flow-dot.d4 { animation:flow4 6s ease-in-out infinite 2s; }

  @keyframes flow1 {
    0%,100% { transform:translate(-50%,-50%) translate(0,0); opacity:.15; }

  }
  @keyframes flow2 {
    0%,100% { transform:translate(-50%,-50%) translate(0,0); opacity:.15; }
    50% { transform:translate(-50%,-50%) translate(175px,-105px); opacity:.95; }
  }
  @keyframes flow3 {
    0%,100% { transform:translate(-50%,-50%) translate(0,0); opacity:.15; }
    50% { transform:translate(-50%,-50%) translate(-185px,70px); opacity:.95; }
  }
  @keyframes flow4 {

&lt;script&gt;
const scenes = [
  document.getElementById(&quot;sceneProduct&quot;),
  document.getElementById(&quot;sceneChannel&quot;),
  document.getElementById(&quot;sceneQuestion&quot;)
];

const chapterLabel = document.getElementById(&quot;chapterLabel&quot;);
const chapterSub = document.getElementById(&quot;chapterSub&quot;);
const dots = [...document.querySelectorAll(&quot;[data-dot]&quot;)];
const productCards = [...document.querySelectorAll(&quot;[data-pcard]&quot;)];
const channelCards = [...document.querySelectorAll(&quot;[data-ccard]&quot;)];

let sceneIndex = 0;
let productIndex = 0;
let channelIndex = 0;
let innerTimer = null;

function clearInner(){
  if(innerTimer) clearInterval(innerTimer);
}

function cycleProduct(){
  clearInner();
  productCards.forEach((c,i)=&gt;c.classList.toggle(&quot;highlight&quot;,i===0));
  productIndex=0;
  innerTimer=setInterval(()=&gt;{
    productIndex=(productIndex+1)%productCards.length;
    productCards.forEach((c,i)=&gt;c.classList.toggle(&quot;highlight&quot;,i===productIndex));
  },1100);
}

function cycleChannels(){
  clearInner();
  channelCards.forEach((c,i)=&gt;c.classList.toggle(&quot;highlight&quot;,i===0));
  channelIndex=0;
  innerTimer=setInterval(()=&gt;{
    channelIndex=(channelIndex+1)%channelCards.length;
    channelCards.forEach((c,i)=&gt;c.classList.toggle(&quot;highlight&quot;,i===channelIndex));
  },1100);
}

function activateScene(i){
  scenes.forEach((s,idx)=&gt;s.classList.toggle(&quot;active&quot;,idx===i));
  dots.forEach((d,idx)=&gt;d.classList.toggle(&quot;active&quot;,idx===i));
  sceneIndex=i;

  if(i===0){
    chapterLabel.textContent=&quot;Product Performance&quot;;
    chapterSub.textContent=&quot;Same product. Different performance by channel.&quot;;
    cycleProduct();
  }else if(i===1){
    chapterLabel.textContent=&quot;Channel Performance&quot;;
    chapterSub.textContent=&quot;Same business. Channels moving differently.&quot;;
    cycleChannels();
  }else{
    clearInner();
    chapterLabel.textContent=&quot;The Question&quot;;
    chapterSub.textContent=&quot;Where should attention go next?&quot;;
  }
}

activateScene(0);

setInterval(()=&gt;{
  activateScene((sceneIndex+1)%3);
},5200);

dots.forEach((d,i)=&gt;d.addEventListener(&quot;click&quot;,()=&gt;activateScene(i)));
&lt;/script&gt;

&lt;section class=&quot;page&quot;&gt;

      Statasphere brings together &lt;strong&gt;what changed, why it matters, what is driving it and what to do next.&lt;/strong&gt;
    &lt;/p&gt;

    &lt;div class=&quot;controls&quot;&gt;

    &lt;div class=&quot;brief-shell&quot;&gt;
      &lt;!-- PRODUCT --&gt;
      &lt;article class=&quot;brief active&quot; id=&quot;productBrief&quot;&gt;
        &lt;div class=&quot;brief-head&quot;&gt;
          &lt;div class=&quot;head-left&quot;&gt;
            &lt;div class=&quot;brief-icon&quot;&gt;▤&lt;/div&gt;
            &lt;div&gt;
              &lt;div class=&quot;eyeline&quot;&gt;Example Product Signal Brief&lt;/div&gt;
              &lt;h2 class=&quot;brief-title&quot;&gt;Visibility Falling on Google Shopping&lt;/h2&gt;
              &lt;div class=&quot;meta&quot;&gt;Detected 2 hours ago · Last 7 days vs previous 7 days&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;severity&quot;&gt;Critical&lt;/div&gt;
        &lt;/div&gt;

        &lt;div class=&quot;story-grid&quot;&gt;
          &lt;div class=&quot;story-card&quot;&gt;
            &lt;div class=&quot;card-label&quot;&gt;What changed&lt;/div&gt;
            &lt;div class=&quot;big-number&quot;&gt;-38%&lt;/div&gt;
            &lt;div class=&quot;card-title&quot;&gt;Product visibility fell sharply.&lt;/div&gt;
            &lt;div class=&quot;card-copy&quot;&gt;Impressions declined across the affected products over the last 7 days.&lt;/div&gt;
          &lt;/div&gt;

          &lt;div class=&quot;story-card&quot;&gt;
            &lt;div class=&quot;card-label&quot;&gt;Why it matters&lt;/div&gt;
            &lt;div class=&quot;card-title&quot;&gt;High-value products are being affected.&lt;/div&gt;
            &lt;div class=&quot;card-copy&quot;&gt;93 products are impacted, including 41 top sellers. Reduced exposure is creating a meaningful commercial risk.&lt;/div&gt;
          &lt;/div&gt;

          &lt;div class=&quot;story-card&quot;&gt;
            &lt;div class=&quot;card-label&quot;&gt;What&#x27;s driving it&lt;/div&gt;
            &lt;div class=&quot;card-title&quot;&gt;The decline is concentrated, not random.&lt;/div&gt;
            &lt;div class=&quot;card-copy&quot;&gt;The largest losses are clustered across high-value products that remain eligible but are receiving materially less exposure.&lt;/div&gt;
          &lt;/div&gt;

          &lt;div class=&quot;story-card&quot;&gt;
            &lt;div class=&quot;card-label&quot;&gt;What to do next&lt;/div&gt;
            &lt;div class=&quot;card-title&quot;&gt;Prioritise the affected products.&lt;/div&gt;
            &lt;div class=&quot;card-copy&quot;&gt;Review feed quality and product segmentation, starting with the highest-value products losing the most visibility.&lt;/div&gt;

                &lt;path d=&quot;M2 8 L15 10 L28 12 L40 11 L54 18 L68 21 L82 25 L96 30 L118 35&quot; stroke=&quot;#cf8fb4&quot; stroke-width=&quot;3&quot; stroke-linecap=&quot;round&quot;/&gt;

          &lt;/div&gt;

          &lt;/div&gt;

      &lt;!-- CHANNEL --&gt;

            &lt;div class=&quot;big-number&quot;&gt;+19%&lt;/div&gt;
            &lt;div class=&quot;card-title&quot;&gt;Spend increased while revenue fell.&lt;/div&gt;

                &lt;path d=&quot;M2 14 L16 15 L30 16 L44 19 L58 21 L72 23 L88 27 L103 29 L118 32&quot; stroke=&quot;#2f315f&quot; stroke-width=&quot;2.5&quot; stroke-linecap=&quot;round&quot; opacity=&quot;.65&quot;/&gt;

const product=document.getElementById(&quot;productBrief&quot;);
const channel=document.getElementById(&quot;channelBrief&quot;);
const progress=document.getElementById(&quot;progress&quot;);
let current=&quot;product&quot;;
let timer=null;

function restartReveal(root){
  root.querySelectorAll(&quot;.story-card,.evidence,.summary-bar&quot;).forEach(el=&gt;{
    el.classList.remove(&quot;reveal&quot;);
    void el.offsetWidth;
    el.classList.add(&quot;reveal&quot;);
  });
  progress.classList.remove(&quot;run&quot;);
  void progress.offsetWidth;
  progress.classList.add(&quot;run&quot;);
}

function show(type){
  current=type;
  product.classList.toggle(&quot;active&quot;,type===&quot;product&quot;);
  channel.classList.toggle(&quot;active&quot;,type===&quot;channel&quot;);
  buttons.forEach(b=&gt;b.classList.toggle(&quot;active&quot;,b.dataset.type===type));
  restartReveal(type===&quot;product&quot;?product:channel);
}

function schedule(){
  clearInterval(timer);
  timer=setInterval(()=&gt;show(current===&quot;product&quot;?&quot;channel&quot;:&quot;product&quot;),6800);
}

buttons.forEach(b=&gt;{
  b.addEventListener(&quot;click&quot;,()=&gt;{
    show(b.dataset.type);

});

show(&quot;product&quot;);
schedule();

.w4{right:12%;top:42%;animation-delay:2.4s}
.w5{left:8%;bottom:21%;animation-delay:3.1s}
.w6{right:8%;bottom:17%;animation-delay:3.8s}
.w7{left:38%;top:8%;animation-delay:4.5s}
.w8{right:34%;bottom:8%;animation-delay:5.2s}
.w9{left:43%;top:28%;animation-delay:5.9s}
@keyframes drift{
  0%{transform:translate3d(-10px,6px,0);opacity:.68}
  100%{transform:translate3d(14px,-10px,0);opacity:1}
}

.fade-mask{
  position:absolute;
  inset:0;
  background:radial-gradient(circle at center,rgba(251,250,251,.02),rgba(251,250,251,.48) 68%,rgba(251,250,251,.82) 100%);
  pointer-events:none;
}

.hero-end{
  flex:1;
  min-height:84vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:8vh 5vw 5vh;
  position:relative;
  z-index:3;
}
.center{
  width:min(900px,90vw);
  text-align:center;
  position:relative;
}
.logo-shell{
  width:170px;
  height:170px;
  margin:0 auto 28px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}
.logo-shell:before,
.logo-shell:after{
  content:&quot;&quot;;
  position:absolute;
  inset:10px;
  border-radius:50%;
  border:1px solid rgba(207,143,180,.30);
  opacity:0;
  animation:ripple 3.4s ease-out infinite;
}
.logo-shell:after{animation-delay:1.55s}
@keyframes ripple{
  0%{opacity:.0;transform:scale(.5)}
  18%{opacity:.55}
  100%{opacity:0;transform:scale(2.2)}
}
.logo{
  width:145px;
  height:145px;
  object-fit:contain;
  position:relative;
  z-index:2;
  animation:logoFloat 5.5s ease-in-out infinite;
  filter:drop-shadow(0 12px 22px rgba(47,49,95,.08));
}
@keyframes logoFloat{
  0%,100%{transform:translateY(0) rotate(0deg)}
  50%{transform:translateY(-8px) rotate(2deg)}
}

.eyebrow{
  font-size:12px;
  letter-spacing:.22em;
  text-transform:uppercase;
  font-weight:800;
  color:#928397;
  margin-bottom:18px;
  opacity:0;
  animation:reveal .8s 1.2s ease forwards;
}
h1{
  margin:0 auto;
  max-width:950px;
  font-size:clamp(54px,6.2vw,94px);
  line-height:.97;
  letter-spacing:-.058em;
  font-weight:570;
  opacity:0;
  transform:translateY(16px);
  animation:reveal .9s 1.55s ease forwards;
}
h1 .pink{color:var(--pink)}
.sub{
  max-width:720px;
  margin:24px auto 0;
  font-size:20px;
  line-height:1.58;
  color:var(--muted);
  opacity:0;
  transform:translateY(12px);
  animation:reveal .8s 2s ease forwards;
}
.brand-signature{
  margin-top:34px;
  font-size:14px;
  letter-spacing:.16em;
  text-transform:uppercase;
  font-weight:800;
  color:#8f8192;
  opacity:0;
  animation:reveal .8s 2.4s ease forwards;
}
.brand-signature span{color:var(--pink)}

.actions{
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
  margin-top:34px;
  opacity:0;
  animation:reveal .8s 2.7s ease forwards;
}
.btn{
  padding:15px 22px;
  border-radius:5px;
  text-decoration:none;
  font-size:14px;
  font-weight:750;
}
.btn.primary{background:var(--navy);color:#fff}
.btn.secondary{background:#fff;color:var(--navy);border:1px solid #dcd8e1}

@keyframes reveal{
  to{opacity:1;transform:translateY(0)}
}

footer{
  position:relative;
  z-index:3;
  background:#2f315f;
  color:#f8f7fa;
  border-top:1px solid rgba(255,255,255,.08);
}
.footer-main{
  max-width:1380px;
  margin:0 auto;
  display:grid;
  grid-template-columns:1.35fr .8fr .8fr 1fr;
  gap:62px;
  padding:52px 5.5vw 46px;
}
.footer-brand-block{
  max-width:330px;
}
.footer-logo-row{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:26px;
}
.footer-logo-row img{
  width:36px;
  height:36px;
  object-fit:contain;
  filter:brightness(0) invert(1);
}
.footer-logo-row strong{
  font-size:20px;
  letter-spacing:-.03em;
}
.footer-tagline{
  font-size:15px;
  line-height:1.5;
  color:#d9dbea;
  margin-bottom:28px;
}
.footer-email{
  color:#dca6c5;
  text-decoration:none;
  font-size:14px;
}
.footer-col-title{
  font-size:11px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:#dca6c5;
  font-weight:800;
  margin-bottom:22px;
}
.footer-links{
  display:grid;
  gap:15px;
}
.footer-links a{
  color:#e5e6ef;
  text-decoration:none;
  font-size:14px;
}
.footer-links a:hover{
  color:#ffffff;
}
.footer-company{
  color:#e5e6ef;
  font-size:14px;
  line-height:1.55;
}
.footer-company strong{
  display:block;
  color:#fff;
  margin-bottom:12px;
}
.footer-bottom{
  border-top:1px solid rgba(255,255,255,.09);
  display:flex;
  justify-content:space-between;
  gap:20px;
  padding:20px 5.5vw 22px;
  color:#bfc3d4;
  font-size:11px;
  max-width:none;
}
.footer-bottom a{
  color:inherit;
  text-decoration:none;
}

@media(max-width:720px){
  .hero-end{padding:70px 20px 44px}
  h1{font-size:54px}
  .sub{font-size:17px}
  .footer-main{grid-template-columns:1fr;gap:34px;padding:40px 20px 34px}
  .footer-bottom{padding:18px 20px 20px;flex-direction:column}
}

<script>
function scrollToSection(id){
  const el=document.getElementById(id);
  if(el) el.scrollIntoView({behavior:"smooth",block:"start"});
}

document.querySelectorAll("[data-target]").forEach(function(el){
  el.addEventListener("click",function(){
    scrollToSection(this.getAttribute("data-target"));
  });
});

window.addEventListener("message",function(event){
  const d=event.data || {};

  if(d.type==="statasphere-height" && d.section){
    const f=document.getElementById("frame-"+d.section);
    if(f && Number.isFinite(Number(d.height))){
      f.style.height=Math.max(500,Number(d.height))+"px";
    }
  }

  if(d.type==="statasphere-nav" && d.target){
    scrollToSection(d.target);
  }
});
</script>
